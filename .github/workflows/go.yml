name: Compile Check

on:
  pull_request:
    branches: [ "homer11" ]
  workflow_dispatch:
    inputs:
      go_version:
        description: Go version override (empty = use src/go.mod)
        required: false
        default: ""

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install build requirements
        run: |
          sudo apt update && sudo apt install -y openssl ca-certificates libluajit-5.1-dev

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          # Empty go-version falls back to go-version-file, so PR checks always
          # match the toolchain required by src/go.mod (manual dispatch can override).
          go-version: ${{ github.event_name == 'workflow_dispatch' && inputs.go_version || '' }}
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Compile project
        run: |
          make release

  postgres-tests:
    name: PostgreSQL ${{ matrix.postgres }} regressions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - postgres: '18.6'
            image: postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
          - postgres: '17.11'
            image: postgres:17.11-alpine3.24@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    container:
      image: golang:1.27.3-bookworm@sha256:972b4110ba0f47539a975c31e52c64765e1ff19f2d74469ae4a595c6676e80a5
      options: --memory 6g
    services:
      postgres:
        image: ${{ matrix.image }}
        env:
          POSTGRES_USER: homer
          POSTGRES_PASSWORD: placeholder
          POSTGRES_DB: homer
        options: >-
          --memory 6g
          --health-cmd "pg_isready -U homer -d homer"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      HOMER_TEST_POSTGRES_DSN: postgres://homer:placeholder@postgres/homer?sslmode=disable
      GOTOOLCHAIN: local
      GOMAXPROCS: '2'
      GOFLAGS: -p=2
    steps:
      - uses: actions/checkout@v5
      - name: Install test requirements
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates build-essential libluajit-5.1-dev curl
      - name: Install checksum-verified DuckDB extensions
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/download_duckdb_extensions.sh
          mkdir -p "$HOME/.duckdb/extensions"
          cp -R bundled_extensions/v1.5.6 "$HOME/.duckdb/extensions/"
      - name: Run PostgreSQL regression tests with race detection
        shell: bash
        working-directory: src
        run: |
          set -euo pipefail
          go test -race -count=1 -json ./config ./coordinator/services ./storage/ducklake ./cli ./node ./server ./writer \
            -run 'Test(Postgres|NodeReadsPostgres|SettingsLiteralRoundTrip|CatalogAttachErrors|AttachBuilders|JWTSecretConfigured|SQLiteShardSpillDirectoryUnchanged)' \
            | tee postgres-results.jsonl
          if grep -q '"Action":"skip"' postgres-results.jsonl; then
            echo 'PostgreSQL regression tests must not skip' >&2
            exit 1
          fi
